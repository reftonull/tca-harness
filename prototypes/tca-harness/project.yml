name: TCAHarnessPrototype
options:
  deploymentTarget:
    macOS: '26.0'
packages:
  DecisionsPackage:
    path: ../../DecisionsPackage
  TCA26:
    url: git@github.com:pointfreeco/TCA26.git
    branch: main
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TCAHarnessPrototype:
    type: tool
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: DecisionsPackage
        product: DecisionHarness
      - package: TCA26
        product: ComposableArchitecture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.laksh.TCAHarnessPrototype
schemes:
  TCAHarnessPrototype:
    build:
      targets:
        TCAHarnessPrototype: all
