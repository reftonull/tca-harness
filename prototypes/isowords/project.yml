name: IsowordsHarness
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  isowords:
    path: .upstream
  Harness:
    path: ../..
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: 1.13.0
  CasePaths:
    url: https://github.com/pointfreeco/swift-case-paths
    exactVersion: 1.7.2
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  IsowordsHarness:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.laksh.IsowordsHarness
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: isowords
        product: HomeFeature
      - package: isowords
        product: SettingsFeature
      - package: isowords
        product: StatsFeature
      - package: isowords
        product: Styleguide
      - package: isowords
        product: ApiClient
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: CasePaths
        product: CasePaths
      - package: Harness
        product: TCAHarnessTCA1
schemes:
  IsowordsHarness:
    build:
      targets:
        IsowordsHarness: all
