name: HarnessValidation
options:
  deploymentTarget:
    macOS: '26.0'
packages:
  Harness:
    path: ../..
  SwiftSyntax:
    url: https://github.com/swiftlang/swift-syntax
    minVersion: 600.0.0
    maxVersion: 605.0.0
  IssueReporting:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    from: 1.4.0
  MacroTesting:
    url: https://github.com/pointfreeco/swift-macro-testing
    from: 0.6.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_TESTING_SEARCH_PATHS: YES
    HEADER_SEARCH_PATHS: "$(inherited) $(BUILD_DIR)/../../SourcePackages/checkouts/swift-syntax/Sources/_SwiftSyntaxCShims/include"
targets:
  HarnessMacroImplementation:
    type: library.static
    platform: macOS
    sources:
      - path: ../../TCAHarnessTCA1/Sources/HarnessMacrosPlugin
        excludes: [Plugin.swift]
    dependencies:
      - package: SwiftSyntax
        products: [SwiftDiagnostics, SwiftSyntax, SwiftSyntaxBuilder, SwiftSyntaxMacros]
  HarnessMacroTests:
    type: bundle.unit-test
    platform: macOS
    sources: [../../TCAHarnessTCA1/Tests/HarnessMacroTests]
    dependencies:
      - target: HarnessMacroImplementation
      - package: MacroTesting
        product: MacroTesting
  RuntimeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [../../TCAHarnessTCA1/Tests/RuntimeTests]
    dependencies:
      - package: IssueReporting
        product: IssueReportingTestSupport
      - package: Harness
        product: TCAHarnessTCA1
schemes:
  HarnessValidation:
    build:
      targets:
        HarnessMacroTests: all
        RuntimeTests: all
    test:
      targets: [HarnessMacroTests, RuntimeTests]
      gatherCoverageData: false
