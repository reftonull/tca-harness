name: IsowordsEmbedded
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  isowords:
    path: .upstream
  ComposableArchitecture:
    url: https://github.com/pointfreeco/swift-composable-architecture
    exactVersion: 1.13.0
  Harness:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  IsowordsEmbedded:
    type: application
    platform: iOS
    sources:
      - path: .upstream/App/iOS
        excludes: [Info.plist]
    info:
      path: EmbeddedInfo.plist
      properties:
        CFBundleDisplayName: isowords + Harness
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.laksh.IsowordsEmbedded
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: isowords
        products: [ApiClientLive, AppAudioLibrary, AppClipAudioLibrary, AppFeature, AudioPlayerClient, Build, DictionarySqliteClient, GameCore, HomeFeature, ServerConfig, ServerConfigClient, SharedModels, SoloFeature, SettingsFeature, Styleguide, UIApplicationClient]
      - package: ComposableArchitecture
        product: ComposableArchitecture
      - package: Harness
        product: TCAHarnessTCA1
schemes:
  IsowordsEmbedded:
    build:
      targets:
        IsowordsEmbedded: all
