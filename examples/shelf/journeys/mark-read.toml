name = "Mark a book as read"
goal = "Find Project Hail Mary, mark it read, and see the unread badge go down"
fixtures = "../fixtures/shelf"
network = "replay"

[[steps]]
do = "Search"
args = { value = "Hail Mary" }

[[steps]]
do = "Open book"

[[steps]]
do = "Mark as read"

[checks]
"it is read" = "all(b.isRead for b in books if b.title == 'Project Hail Mary')"
"the badge went down" = "unreadCount == 1"

[budget]
requests = 3    # GET /books, POST /events (search), PUT /books/<id>
