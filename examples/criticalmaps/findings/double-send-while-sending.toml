# FINDING (a race): a second tap on Send while the first message is posting posts it again.
# ChatFeature's `.onCommit` doesn't check `isSending`, the send button only shows a spinner (it is
# hidden for a blank draft, never disabled), and the draft is cleared only when the POST answers.
# With 300 ms of replay latency the second tap lands 30 ms into the first POST: two POST /messages
# with the same text. Expected to FAIL on ef2e06d (the race's requests).
name = "Send a chat message with a double tap"
goal = "Tap Send twice quickly while the message is posting; it is posted once"
fixtures = "../fixtures/criticalmaps"
network = "replay"
latency = { ms = 300 }

[[steps]]
do = "Continue"

[[steps]]
do = "Open chat and Mastodon"

[[steps]]
do = "Type a chat message"
args = { value = "Meet at the fountain?" }

[[steps]]
do = "Send chat message"

[[steps]]
do = "Send chat message"
no_wait = true
after_ms = 30
requests = ["POST /messages", "GET /messages"]   # one post, then the refetch

[checks]
"the draft is cleared" = "social.chat.draft == ''"
