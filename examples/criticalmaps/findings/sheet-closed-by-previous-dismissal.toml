# FINDING (UI rung only): every sheet's `onDismiss` sends `.dismissDestination` / `.whatsNewDismissed`
# when its dismissal animation ends, and those set `destination = nil` unconditionally. Opening the
# next sheet during that animation (here: chat right after Continue on What's New) closes it again.
# Run on the simulator without pacing:
#   tca journey run findings/sheet-closed-by-previous-dismissal.toml --target ui
# Fails there (the new sheet is gone, and TCA reports an `ifLet` action for absent state); passes
# headless and with --pace 1, where nothing races the animation.
name = "A sheet opened right after another closes stays open"
goal = "Continue past What's New and open the chat straight away"
fixtures = "../fixtures/criticalmaps"
network = "replay"

[[steps]]
do = "Continue"

[[steps]]
do = "Open chat and Mastodon"

[checks]
"the chat is open" = "sheet == 'social'"
