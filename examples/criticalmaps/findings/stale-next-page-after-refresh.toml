# FINDING (a race, found by `tca chaos --reorder`): pulling to refresh while the next page is still
# loading doesn't cancel it. Neither TootFeedFeature effect is cancellable, so when the old next-page
# response lands after the refresh, it is appended to the refreshed list: 80 toots instead of the
# first page, and against a live feed a gap (the page continues from the old list's last toot).
# Expected to FAIL on ef2e06d. The fault holds the next-page response back 1 s so it arrives last.
name = "Refresh while the next page loads"
goal = "Scroll to the end of the Mastodon feed, pull to refresh before the next page arrives, and see the first page"
fixtures = "../fixtures/criticalmaps"
network = "replay"

[[faults]]
match = { method = "GET", path = "/api/v1/timelines/tag/CriticalMass" }
kind = "delay"
delayMs = 1000
times = 1
skip = 1

[[steps]]
do = "Continue"

[[steps]]
do = "Open chat and Mastodon"

[[steps]]
do = "Show Mastodon"

[[steps]]
do = "Scroll to the end of the feed"

# 50 ms after the scroll, while its page is in flight.
[[steps]]
do = "Pull to refresh"
no_wait = true
after_ms = 50

[checks]
"the first page is back after refreshing" = "len(social.mastodon.toots) == 40"
"no toot twice" = "len(set(t.id for t in social.mastodon.toots)) == len(social.mastodon.toots)"
