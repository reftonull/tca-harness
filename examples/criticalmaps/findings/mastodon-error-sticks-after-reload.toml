# FINDING: after one failed load, Reload fetches the feed but TootFeedFeature never clears `error`,
# so the feed stays on the error screen until the sheet is reopened. Expected to FAIL on ef2e06d.
name = "Mastodon recovers after a failed load"
goal = "The first feed load fails; Reload shows the feed"
fixtures = "../fixtures/criticalmaps"
network = "replay"

[[faults]]
match = { method = "GET", path = "/api/v1/timelines/tag/CriticalMass" }
kind = "status"
status = 503
times = 1

[[steps]]
do = "Continue"

[[steps]]
do = "Open chat and Mastodon"

[[steps]]
do = "Show Mastodon"

[[steps]]
do = "Reload"

[checks]
"the feed is shown" = "social.mastodon.screen == 'list'"
