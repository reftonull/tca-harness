# The upstream iOS app target (iOS/, unchanged apart from setup.py's App.swift patch) built against the
# pinned CriticalMapsKit and the local harness. Generated by setup.py: `xcodegen generate`.
name: CriticalMapsEmbedded
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  CriticalMapsKit:
    path: .upstream/CriticalMapsKit
  ComposableCoreLocation:
    url: https://github.com/mltbnz/composable-core-location
    branch: tca-migration
  Harness:
    path: ../..
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_ALLOWED: NO
    MARKETING_VERSION: 4.10.1
    CURRENT_PROJECT_VERSION: 260807
targets:
  CriticalMapsEmbedded:
    type: application
    platform: iOS
    sources:
      - path: .upstream/iOS
        excludes: [Info.plist, Package.swift, Previews, '*.icon', '*.gpx']
    settings:
      base:
        INFOPLIST_FILE: .upstream/iOS/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: de.pokuslabs.criticalmaps.harness
        PRODUCT_NAME: CriticalMapsEmbedded
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: '1,2'
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: CriticalMapsKit
        products: [ApiClient, AppFeature, AppIntentFeature, ChatFeature, FeedbackGeneratorClient, GuideFeature, MapFeature,
          MastodonFeedFeature, NextRideFeature, SettingsFeature, SharedKeys, SharedModels, SocialFeature, Styleguide, UIApplicationClient]
      - package: ComposableCoreLocation
        product: ComposableCoreLocation
      - package: Harness
        product: TCAHarnessTCA1
schemes:
  CriticalMapsEmbedded:
    build:
      targets:
        CriticalMapsEmbedded: all
