# Proof that recording against production can't write to it:
#
#   tca journey run proof/live-guard-chat.toml --target live --network record --report /tmp/guard-chat.jsonl
#
# Expected: FAIL with a `network` finding "Refused POST api-gw.criticalmaps.net/messages (live guard ...)",
# and only GETs with source `live` in the report (the launch's riders, chat and next-ride fetches).
# Recorded cassettes go to fixtures/raw (gitignored).
name = "Live guard: chat"
goal = "Try to send a chat message while recording production; it is refused"
fixtures = "../fixtures/raw"
network = "record"

[[steps]]
do = "Continue"

[[steps]]
do = "Open chat and Mastodon"

[[steps]]
do = "Type a chat message"
args = { value = "tca-harness guard test: this must never be sent" }

[[steps]]
do = "Send chat message"
