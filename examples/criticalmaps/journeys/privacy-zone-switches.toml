name = "Privacy zone switches"
goal = "With a zone where you are, switching the zone or the whole feature off lets the location out, and switching it back on stops it again"
fixtures = "../fixtures/criticalmaps"
network = "replay"
launch_requests = ["GET /messages", "GET /locations", "GET /api/ride"]

[[steps]]
do = "Continue"
requests = []

[[steps]]
do = "Open settings"
requests = []

[[steps]]
do = "Open privacy zones"
requests = []

[[steps]]
do = "Turn privacy zones on"
requests = []

[[steps]]
do = "Add a privacy zone"
requests = []

[[steps]]
do = "Place the zone at your position"
requests = []

[[steps]]
do = "Name the zone"
args = { value = "Home" }
requests = []

[[steps]]
do = "Create the zone"
requests = []

[[steps]]
do = "Turn this zone off"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = ["PUT /locations"]

[[steps]]
do = "Turn this zone on"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = []

[[steps]]
do = "Turn privacy zones off"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = ["PUT /locations"]

[[steps]]
do = "Turn privacy zones on"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = []

[checks]
"posted only while the zone or the feature was off" = "map.locationsPosted == 2"
"the zone protects you again" = "map.insideActiveZone and settings.privacyZones.zonesOn and settings.privacyZones.zones[0].active"
