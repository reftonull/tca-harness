name = "Privacy zone stops posting"
goal = "Create a privacy zone where you are: while it is active the app posts no location; once it is deleted, posting resumes"
fixtures = "../fixtures/criticalmaps"
network = "replay"
launch_requests = ["GET /messages", "GET /locations", "GET /api/ride"]

[[steps]]
do = "Continue"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = ["PUT /locations"]

[[steps]]
do = "Open settings"
requests = []

[[steps]]
do = "Open privacy zones"
requests = []

[[steps]]
do = "Turn privacy zones on"
requests = []

[[steps]]
do = "Add a privacy zone"
requests = []

[[steps]]
do = "Place the zone at your position"
requests = []

[[steps]]
do = "Name the zone"
args = { value = "Home" }
requests = []

[[steps]]
do = "Set the zone radius (m)"
args = { value = 400 }
requests = []

[[steps]]
do = "Create the zone"
requests = []

[[steps]]
do = "Swipe down to close settings"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = []

[[steps]]
do = "Let a minute pass (the app refreshes riders)"
requests = ["GET /locations"]

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = []

[[steps]]
do = "Open settings"
requests = []

[[steps]]
do = "Open privacy zones"
requests = []

[[steps]]
do = "Delete this zone"
requests = []

[[steps]]
do = "Delete the zone"
requests = []

[[steps]]
do = "Back to settings"
requests = []

[[steps]]
do = "Close settings"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = ["PUT /locations"]

[checks]
"posted before and after the zone, never from inside it" = "map.locationsPosted == 2"
"the zone is gone" = "not map.insideActiveZone and sheet == None"
