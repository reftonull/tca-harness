# The first POST /messages fails: the chat shows an error and keeps the draft. Dismissing the error
# is finding 10 (findings/chat-error-cannot-be-dismissed.toml).
name = "Chat send error"
goal = "Sending a chat message fails; the chat says so and keeps the draft"
fixtures = "../fixtures/criticalmaps"
network = "replay"
launch_requests = ["GET /locations", "GET /messages", "GET /api/ride"]

[[faults]]
match = { method = "POST", path = "/messages" }
kind = "status"
status = 500
times = 1

[[steps]]
do = "Continue"
requests = []

[[steps]]
do = "Open chat and Mastodon"
requests = ["GET /messages"]

[[steps]]
do = "Type a chat message"
args = { value = "Meet at the fountain?" }
requests = []

[[steps]]
do = "Send chat message"
requests = ["POST /messages"]

[checks]
"the error is shown" = "social.chat.alert and not social.chat.sending"
"the draft is kept" = "social.chat.draft == 'Meet at the fountain?'"
"the messages are still shown" = "len(social.chat.messages) >= 3"
