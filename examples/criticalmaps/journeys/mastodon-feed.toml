name = "Mastodon feed"
goal = "Read the #CriticalMass Mastodon feed to the end, then pull to refresh"
fixtures = "../fixtures/criticalmaps"
network = "replay"
launch_requests = ["GET /locations", "GET /messages", "GET /api/ride"]

[[steps]]
do = "Continue"
requests = []

[[steps]]
do = "Open chat and Mastodon"
requests = ["GET /messages"]

[[steps]]
do = "Show Mastodon"
requests = ["GET /api/v1/timelines/tag/CriticalMass"]

[[steps]]
do = "Scroll to the end of the feed"
requests = ["GET /api/v1/timelines/tag/CriticalMass"]

[[steps]]
do = "Scroll to the end of the feed"
requests = ["GET /api/v1/timelines/tag/CriticalMass"]

[[steps]]
do = "Pull to refresh"
requests = ["GET /api/v1/timelines/tag/CriticalMass"]

[checks]
"the feed is shown" = "social.mastodon.screen == 'list'"
"the first page is back after refreshing" = "len(social.mastodon.toots) == 40"
"no toot twice" = "len(set(t.id for t in social.mastodon.toots)) == len(social.mastodon.toots)"
