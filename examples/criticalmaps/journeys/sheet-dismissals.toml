# Every sheet's `onDismiss` runs on the headless host too: closing What's New with its Close button
# marks it seen (`whatsNewDismissed` saves the version), as in the app. Then each sheet is swiped down.
name = "Sheet dismissals"
goal = "Close What's New and see it marked as seen, then swipe the chat and settings sheets down"
fixtures = "../fixtures/criticalmaps"
network = "replay"
launch_requests = ["GET /locations", "GET /messages", "GET /api/ride"]

[[steps]]
do = "Close What's New"
expect = "sheet == None and whatsNewSeen == '4.10.1'"
requests = []

[[steps]]
do = "Open chat and Mastodon"
requests = ["GET /messages"]

[[steps]]
do = "Swipe down to close chat and Mastodon"
expect = "sheet == None"
requests = []

[[steps]]
do = "Open settings"
requests = []

[[steps]]
do = "Swipe down to close settings"
requests = []

[checks]
"no sheet covers the map" = "sheet == None"
"What's New is marked as seen" = "whatsNewSeen == '4.10.1'"
