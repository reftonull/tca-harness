name = "Event settings"
goal = "Widen the ride search to 20 km, hide demonstrations, then turn ride events off and see the banner go away"
fixtures = "../fixtures/criticalmaps"
network = "replay"

[[steps]]
do = "Continue"

[[steps]]
do = "Open settings"

[[steps]]
do = "Open event settings"

[[steps]]
do = "Set the ride search radius (km)"
args = { value = "20" }

[[steps]]
do = "root/settings/rideEvents/types/DEMONSTRATION/hide"

[[steps]]
do = "Turn ride events off"

[[steps]]
do = "Back to settings"

[[steps]]
do = "Close settings"

[checks]
"the banner is gone" = "not map.nextRideBanner"
"back on the map" = "sheet == None"
