name = "Riding with the map open"
goal = "Ride with the map open for two minutes: the app posts your location every 30 seconds and refreshes the riders every minute"
fixtures = "../fixtures/criticalmaps"
network = "replay"
launch_requests = ["GET /messages", "GET /locations", "GET /api/ride"]

[[steps]]
do = "Continue"
requests = []

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = ["PUT /locations"]

[[steps]]
do = "Let a minute pass (the app refreshes riders)"
requests = ["GET /locations"]

[[steps]]
do = "Let 30 seconds pass (the app posts your location)"
requests = ["PUT /locations"]

[[steps]]
do = "Let a minute pass (the app refreshes riders)"
requests = ["GET /locations"]

[checks]
"your location was posted twice" = "map.locationsPosted == 2"
"riders are still on the map" = "map.riders == 12 and not map.loadingRiders"
"no unread badge on the map" = "chatBadge == 0"
