# How `tca journey run`, `explore`, `chaos`, `determinism` and `diff` launch Critical Maps
# (docs/testing.md#targets). Every run gets a fresh process and a fresh install: settings, the chat
# read marker and the What's New flag live in in-memory storage (CriticalMapsHarness.prepare).
#
# Network safety: every target installs the read-only live guard. In `record` and `live` only GET/HEAD
# to criticalmaps.net, criticalmass.in and mastodon.social can leave the process; location updates and
# chat messages are refused and reported. Without TCA_HARNESS_NETWORK the app blocks all requests.

# Rung 1: the upstream AppFeature in a Mac Catalyst process. Build first:
#   (cd headless && swift build --triple arm64-apple-ios-macabi)
[targets.headless]
launch = "headless/.build/out/Products/Debug-maccatalyst/criticalmaps-headless --port {port}"
port = "auto"
ready = "TCA harness listening"
restart = "per-run"

# Rung 2: the real app on the iPhone 17 Pro simulator. Build with `flowdeck build --config flowdeck.json`.
[targets.ui]
launch = 'flowdeck run --no-build --config flowdeck.json --launch-env "TCA_HARNESS=1 {env}"'
port = 8793
ready = "App Launched Successfully"
restart = "per-run"
ready_timeout = 120
stop = "flowdeck stop de.pokuslabs.criticalmaps.harness"

# Rung 3: the headless host against the production read endpoints, guard on. For re-recording
# (`--network record`, then fixtures/sanitize.py) and contract checks. Use sparingly: a handful of
# GETs per journey.
[targets.live]
launch = "headless/.build/out/Products/Debug-maccatalyst/criticalmaps-headless --port {port}"
port = "auto"
ready = "TCA harness listening"
restart = "per-run"

# Rung 1 for a returning user who allowed location access before this launch, so the app starts
# location updates at launch instead of asking.
[targets.headless-returning]
launch = "headless/.build/out/Products/Debug-maccatalyst/criticalmaps-headless --port {port}"
port = "auto"
ready = "TCA harness listening"
restart = "per-run"
env = { CRITICALMAPS_HARNESS_LOCATION = "granted" }
